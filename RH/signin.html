<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario - RH Taller Node</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js" defer></script>
    <script src="./js/signin.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-6 offset-3">
                <h1>Registrar usuario</h1>
            </div>
        </div>
        <div class="row align-items-center">
            <div class="col-6 offset-3">
                <form id="form-signin" novalidate>
                    <div class="form-group">
                        <label for="input-name">Nombre de usuario</label>
                        <input type="text" class="form-control" id="input-name"
                            placeholder="Nombre del nuevo usuario" maxlength="50" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="input-mail">Correo electrónico</label>
                        <input type="email" class="form-control" id="input-mail"
                            placeholder="correo@dominio.ext" maxlength="150" autocomplete="off" required>
                        <small class="form-text text-muted">Con este correo iniciará sesión.</small>
                    </div>
                    <div class="form-group">
                        <label for="input-password">Contraseña</label>
                        <input type="password" class="form-control" id="input-password"
                            placeholder="Contraseña" maxlength="72" autocomplete="new-password" required>
                        <small class="form-text text-muted">Entre 8 y 72 caracteres.</small>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Registrar usuario</button>
                        <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
